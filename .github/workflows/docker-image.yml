name: CI/CD Docker ALTN71 2026

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  DOCKER_ACCOUNT: ${{ secrets.DOCKER_ACCOUNT }}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Tests
        run: dotnet test GestionOrdinateurs.Tests/GestionOrdinateurs.Tests.csproj --no-build --verbosity normal

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and Push AuthentificationApi
        run: |
          docker build -t ${{ env.DOCKER_ACCOUNT }}/authentificationapi:latest -f AuthentificationApi/Dockerfile .
          docker push ${{ env.DOCKER_ACCOUNT }}/authentificationapi:latest

      - name: Build and Push GestionOrdinateurs.API
        run: |
          docker build -t ${{ env.DOCKER_ACCOUNT }}/gestionordinateurs-api:latest -f GestionOrdinateurs.API/Dockerfile .
          docker push ${{ env.DOCKER_ACCOUNT }}/gestionordinateurs-api:latest

      - name: Build and Push Gateway
        run: |
          docker build -t ${{ env.DOCKER_ACCOUNT }}/gestionordinateurs-gateway:latest -f GestionOrdinateurs.Gateway/Dockerfile .
          docker push ${{ env.DOCKER_ACCOUNT }}/gestionordinateurs-gateway:latest

      - name: Build and Push Client Blazor
        run: |
          docker build -t ${{ env.DOCKER_ACCOUNT }}/gestionordinateurs-client:latest -f GestionOrdinateurs.Client/Dockerfile .
          docker push ${{ env.DOCKER_ACCOUNT }}/gestionordinateurs-client:latest